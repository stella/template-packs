name: validate

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Validate packs
        run: bun scripts/validate.ts
      - name: Check index.json is current
        run: bun scripts/build-index.ts --check
      - name: Typecheck scripts
        run: bunx tsc -p tsconfig.json

  ci-result:
    if: always()
    needs: [validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every validation job
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
        run: test "$VALIDATE_RESULT" = success
